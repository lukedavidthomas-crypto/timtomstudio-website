<svg width="900" height="260" viewBox="0 0 900 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">TimTom Studio logo</title>
  <desc id="desc">A neon gradient outlined shape with TimTom Studio wordmark.</desc>
  <defs>
    <linearGradient id="countaGradient" x1="80" y1="40" x2="780" y2="225" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C084FC"/>
      <stop offset="0.16" stop-color="#38BDF8"/>
      <stop offset="0.31" stop-color="#FF3FA4"/>
      <stop offset="0.48" stop-color="#FF7A3D"/>
      <stop offset="0.64" stop-color="#FFE85C"/>
      <stop offset="0.81" stop-color="#5CFF8F"/>
      <stop offset="1" stop-color="#22E7FF"/>
    </linearGradient>
    <linearGradient id="softEdge" x1="50" y1="30" x2="240" y2="225" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B26CFF"/>
      <stop offset="0.2" stop-color="#35C8FF"/>
      <stop offset="0.4" stop-color="#FF45B5"/>
      <stop offset="0.6" stop-color="#FFD84D"/>
      <stop offset="0.8" stop-color="#5AFF9D"/>
      <stop offset="1" stop-color="#20F2FF"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="11" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.55 0 1 0 0 0.85 0 0 1 0 1 0 0 0 1 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="roundedIcon">
      <rect x="44" y="34" width="190" height="190" rx="48"/>
    </clipPath>
  </defs>

  <rect x="44" y="34" width="190" height="190" rx="48" fill="#101827"/>
  <rect x="50" y="40" width="178" height="178" rx="42" stroke="url(#softEdge)" stroke-width="10" filter="url(#glow)"/>
  <g clip-path="url(#roundedIcon)" opacity="0.62">
    <circle cx="70" cy="72" r="64" fill="#B26CFF"/>
    <circle cx="226" cy="72" r="68" fill="#20F2FF"/>
    <circle cx="88" cy="210" r="72" fill="#FF45B5"/>
    <circle cx="220" cy="210" r="76" fill="#5AFF9D"/>
  </g>
  <rect x="84" y="78" width="110" height="104" rx="26" fill="#101827" fill-opacity="0.86" stroke="#FFFFFF" stroke-opacity="0.14"/>
  <text x="104" y="148" fill="url(#countaGradient)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="58" font-weight="900" letter-spacing="-3">TT</text>

  <text x="270" y="124" fill="url(#countaGradient)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="74" font-weight="900" letter-spacing="-2">TimTom</text>
  <text x="274" y="178" fill="#172033" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="36" font-weight="800" letter-spacing="9">STUDIO</text>
  <path d="M274 204H742" stroke="url(#countaGradient)" stroke-width="5" stroke-linecap="round" opacity="0.82"/>
</svg>
